server:
  port: 8080

spring:
  application:
    name: hr-api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true      # Ativa a descoberta de serviços via Eureka
          lower-case-service-id: true  # Usa nomes de serviço em minúsculo

eureka:
  client:
    register-with-eureka: true      # Registra o gateway no servidor Eureka
    fetch-registry: true            # Busca lista de serviços disponíveis
    service-url:
      defaultZone: http://localhost:8761/eureka/
